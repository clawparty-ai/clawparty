<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="xterm.min.css" />
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    #terminal { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script src="xterm.min.js"></script>
  <script src="xterm-addon-fit.min.js"></script>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      fontFamily: 'Menlo, Monaco, "Courier New", monospace',
      fontSize: 13,
      theme: { background: '#1e1e1e', foreground: '#d4d4d4' },
      allowProposedApi: true
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    // 发送用户输入到 Swift
    term.onData(data => {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.input) {
        window.webkit.messageHandlers.input.postMessage(data);
      }
    });

    // Swift 调用此函数写入数据到终端
    window.termWrite = function(data) {
      term.write(data);
    };

    // Swift 调用此函数调整大小
    window.termResize = function(cols, rows) {
      term.resize(cols, rows);
      fitAddon.fit();
    };

    window.addEventListener('resize', () => fitAddon.fit());
  </script>
</body>
</html>
