# ClawParty WebSocket 关键配置片段
# 合并到现有 server { } 块中（listen 443 ssl 那个）

# ---- WebSocket 代理 ----
location /ws/ {
    proxy_pass http://127.0.0.1:后端端口;   # 改成你实际的 upstream

    # Upgrade 头（保持现有可用配置即可）
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 关键：默认 60s 会掐断空闲 WS。配合客户端 25s 心跳后这只是兜底。
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 后端短暂抖动时不要把 502 直接抛给用户，让连接断开由客户端重连即可
    proxy_connect_timeout 5s;
}

# ---- 静态资源性能修复（顺带解决上轮发现的问题）----

# 1. 开启 gzip（1.13MB 的 JS 可压到 ~350KB）
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_vary on;

location /assets/ {
    # 带 hash 的构建产物：一年强缓存
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# 2. HTML 不缓存，保证发版后用户拿到新入口
location = / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}

# 3. 安全响应头（纵深防御：即使存在 XSS 也能阻断大部分利用）
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 注意：CSP 上线前先用 Report-Only 观察，确认无误伤再改严格
add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss: https:" always;

# 4. SPA fallback 只对非 API 路径生效，避免 /.env 等探测路径返回 200 首页
location / {
    try_files $uri /index.html;
}
