name: Release ZTM Cli

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'v*.*'
      - 'v*.*.*'
      - 'v*.*.*-*'
      - '*.*'
      - '*.*.*'
      - '*.*.*-*'

env:
  PACKAGE_OUTPUT: true

jobs:
  set-release-version:
    name: set-release-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set RELEASE_VERSION
        id: version
        run: |
          CI_COMMIT_DATE=$(git log -1 --format="%ad" --date=format:"%Y%m%d%H%M")
          echo "CI_COMMIT_DATE=${CI_COMMIT_DATE}" >> $GITHUB_ENV
          git fetch --tags
          RELEASE_VERSION=`git name-rev --tags --name-only $(git rev-parse HEAD)`
          if [ $RELEASE_VERSION = 'undefined' ]
          then
              echo "release_version=nightly-${CI_COMMIT_DATE}" >> $GITHUB_OUTPUT
              echo "version=nightly" >> $GITHUB_OUTPUT
              echo "commit_date=${CI_COMMIT_DATE}" >> $GITHUB_OUTPUT
          else
              echo "release_version=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
              echo "commit_date=${CI_COMMIT_DATE}" >> $GITHUB_OUTPUT
          fi
          CI_COMMIT_SHA=$(git log -1 --format=%H)
          echo "commit_sha=$CI_COMMIT_SHA"  >> $GITHUB_OUTPUT

      - name: Show envs
        run: export
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      commit_date: ${{ steps.version.outputs.commit_date }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}

  create-draft-release:
    needs: set-release-version
    name: create-draft-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ needs.set-release-version.outputs.release_version }}
          generate_release_notes: true

  build-windows:
    needs: [set-release-version, create-draft-release]
    name: build-windows
    uses: ./.github/workflows/windows-release-build.yml
    with:
      tag: ${{ needs.set-release-version.outputs.release_version }}
    secrets: inherit
    permissions:
      contents: write

  build-macos-m1:
    needs: [set-release-version, create-draft-release]
    name: build-macos-m1
    uses: ./.github/workflows/macos-m1-release-build.yml
    with:
      tag: ${{ needs.set-release-version.outputs.release_version }}
    secrets: inherit
    permissions:
      contents: write

  build-linux-x86:
    needs: [set-release-version, create-draft-release]
    name: build-linux-x86
    uses: ./.github/workflows/linux-x86-release-build.yml
    with:
      tag: ${{ needs.set-release-version.outputs.release_version }}
    secrets: inherit
    permissions:
      contents: write

  build-linux-arm64:
    needs: [set-release-version, create-draft-release]
    name: build-linux-arm64
    uses: ./.github/workflows/linux-arm64-release-build.yml
    with:
      tag: ${{ needs.set-release-version.outputs.release_version }}
    secrets: inherit
    permissions:
      contents: write
