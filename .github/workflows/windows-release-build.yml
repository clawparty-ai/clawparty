name: windows-release-build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.5.3)'
        required: true
        default: 'v0.5.3'
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.5.3)'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history including tags for git describe

      - name: Setup MSBuild (x64)
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.25.0"
          ninjaVersion: "^1.11.1"

      - name: Setup NASM
        uses: ilammy/setup-nasm@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch all tags
        shell: bash
        run: git fetch --force --tags

      # Step A: Build GUI FIRST (makes files available for Pipy to embed)
      - name: Install GUI dependencies
        working-directory: ./chat-gui
        env:
          NODE_ENV: development
        run: npm ci --no-audit

      - name: Build Web GUI
        working-directory: ./chat-gui
        run: npm run build

      # Clear Pipy codebase cache so it re-packs tui/gui into ztm binary
      - name: Clear Pipy codebase cache
        run: IF EXIST pipy\build\deps\codebases.tar.gz.h DEL pipy\build\deps\codebases.tar.gz.h

      # Step B: Build ztm (Pipy) — must happen AFTER GUI is in tui/gui/
      - name: Build ztm (Pipy)
        run: |
          CALL build\deps.cmd
          CALL build\pipy.cmd
          IF NOT EXIST bin (MD bin)
          COPY pipy\bin\Release\pipy.exe bin\ztm.exe

      # Step C: Build ZeroClaw
      - name: Build ZeroClaw
        run: |
          cd zeroclaw
          cargo build --release --features gateway
          cd ..
          COPY zeroclaw\target\release\zeroclaw.exe bin\zeroclaw.exe

      # Note: ClawParty (TUI) is Unix-only (uses libc::kill, process_group(), etc.)
      # It is NOT built for Windows. Only ztm and zeroclaw are available on Windows.

      - name: Verify binaries
        shell: powershell
        run: |
          Write-Host "=== File sizes ==="
          Get-ChildItem -Path "bin\" | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}}
          if (Test-Path "tui\gui\index.html") {
            Write-Host "GUI files:"
            Get-ChildItem -Recurse -Path "tui\gui" | Measure-Object -Property Length -Sum | Select-Object @{N='SizeMB';E={[math]::Round($_.Sum/1MB,2)}}
          }
          $fail = $false
          if (-Not (Test-Path "bin\ztm.exe")) {
            Write-Error "Missing binary: bin\ztm.exe"
            $fail = $true
          }
          if (-Not (Test-Path "bin\zeroclaw.exe")) {
            Write-Error "Missing binary: bin\zeroclaw.exe"
            $fail = $true
          }
          if (-Not (Test-Path "tui\gui\index.html")) {
            Write-Error "GUI build failed: tui\gui\index.html not found"
            $fail = $true
          }
          # CRITICAL: verify GUI is actually embedded inside ztm.exe binary
          $ztmBytes = [System.IO.File]::ReadAllBytes("bin\ztm.exe")
          $ztmText = [System.Text.Encoding]::UTF8.GetString($ztmBytes)
          if ($ztmText.Contains("gui/index.html")) {
            Write-Host "VERIFIED: gui/index.html IS embedded in ztm.exe"
          } elseif ($ztmText.Contains("gui\\index.html")) {
            Write-Host "VERIFIED: gui\index.html IS embedded in ztm.exe"
          } else {
            # Also check for other known GUI file paths
            $foundGui = $false
            @("assets/index-","favicon.ico","index.html") | ForEach-Object {
              if ($ztmText.Contains($_)) { $foundGui = $true }
            }
            if ($foundGui) {
              Write-Host "VERIFIED: GUI content detected inside ztm.exe"
            } else {
              Write-Error "CRITICAL: ztm.exe does NOT contain GUI content! Pipy codebase packing failed."
              $fail = $true
            }
          }
          if ($fail) { exit 1 }
          Write-Host "All Windows binaries and GUI verified OK (clawparty TUI is Unix-only)"

      - name: Package release (ZIP)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item "bin\ztm.exe" "dist\ztm.exe"
          Copy-Item "bin\zeroclaw.exe" "dist\zeroclaw.exe"
          Copy-Item -Recurse -Force "tui\gui" "dist\gui"
          if (Test-Path "windows\start.bat") {
            Copy-Item "windows\start.bat" "dist\start.bat"
          }
          if (Test-Path "windows\stop.bat") {
            Copy-Item "windows\stop.bat" "dist\stop.bat"
          }
          Write-Host "=== dist directory contents ==="
          Get-ChildItem -Recurse -Path "dist" | Select-Object FullName, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}}
          $tag = "${{ inputs.tag }}"
          Compress-Archive -Path "dist\*" -DestinationPath "clawparty-$tag-win-x86_64.zip"
          Write-Host "=== ZIP file size ==="
          Get-Item "clawparty-$tag-win-x86_64.zip" | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawparty-${{ inputs.tag }}-win-x86_64
          path: clawparty-${{ inputs.tag }}-win-x86_64.zip

      - name: Upload Release Asset
        if: inputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $tag = "${{ inputs.tag }}"
          $file = "clawparty-$tag-win-x86_64.zip"
          gh release upload $tag $file --clobber
