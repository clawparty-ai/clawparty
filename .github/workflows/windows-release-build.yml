name: windows-release-build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.5.3)'
        required: true
        default: 'v0.5.3'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history including tags for git describe

      - name: Setup MSBuild (x64)
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.25.0"
          ninjaVersion: "^1.11.1"

      - name: Setup NASM
        uses: ilammy/setup-nasm@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch all tags
        shell: bash
        run: git fetch --force --tags

      - name: Build ztm (Pipy)
        run: |
          CALL build\deps.cmd
          CALL build\pipy.cmd
          IF NOT EXIST bin (MD bin)
          COPY pipy\bin\Release\pipy.exe bin\ztm.exe

      - name: Build ZeroClaw
        run: |
          cd zeroclaw
          cargo build --release --features gateway
          cd ..
          COPY zeroclaw\target\release\zeroclaw.exe bin\zeroclaw.exe

      - name: Build ClawParty (TUI)
        run: |
          cd tui
          cargo build --release
          cd ..
          COPY tui\target\release\clawparty.exe bin\clawparty.exe

      - name: Install GUI dependencies
        working-directory: ./chat-gui
        env:
          NODE_ENV: development
        run: npm ci --no-audit

      - name: Build Web GUI
        working-directory: ./chat-gui
        run: npm run build

      - name: Verify binaries
        shell: powershell
        run: |
          $fail = $false
          if (-Not (Test-Path "bin\ztm.exe")) {
            Write-Error "Missing binary: bin\ztm.exe"
            $fail = $true
          }
          if (-Not (Test-Path "bin\zeroclaw.exe")) {
            Write-Error "Missing binary: bin\zeroclaw.exe"
            $fail = $true
          }
          if (-Not (Test-Path "bin\clawparty.exe")) {
            Write-Error "Missing binary: bin\clawparty.exe"
            $fail = $true
          }
          if (-Not (Test-Path "agent\gui\index.html")) {
            Write-Error "GUI build failed: agent\gui\index.html not found"
            $fail = $true
          }
          if ($fail) { exit 1 }
          Write-Host "All binaries and GUI verified OK"

      - name: Package release (ZIP)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item "bin\ztm.exe" "dist\ztm.exe"
          Copy-Item "bin\zeroclaw.exe" "dist\zeroclaw.exe"
          Copy-Item "bin\clawparty.exe" "dist\clawparty.exe"
          Copy-Item -Recurse -Force "agent\gui" "dist\gui"
          $tag = "${{ github.event.inputs.tag }}"
          Compress-Archive -Path "dist\*" -DestinationPath "clawparty-$tag-win-x86_64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawparty-${{ github.event.inputs.tag }}-win-x86_64
          path: clawparty-${{ github.event.inputs.tag }}-win-x86_64.zip

      - name: Upload Release Asset
        if: github.event.inputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          $file = "clawparty-$tag-win-x86_64.zip"
          gh release upload $tag $file --clobber
