[package]
name = "clawparty"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clawparty"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
anyhow = "1"
rand = "0.9"
tui-scrollview = "0.6"
libc = "0.2"
url = "2"
rusqlite = { version = "0.39.0", features = ["bundled"] }

# HTTPS proxy
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-rustls = "0.26"
rustls-pemfile = "2"
rcgen = "0.13"
tokio-tungstenite = "0.24"
futures-util = "0.3"
tower-service = "0.3"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
rust-embed = { version = "8", features = ["include-exclude"] }
